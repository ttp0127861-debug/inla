          description: RND-01
        dieCost:
          type: number
          minimum: 0
          nullable: true
          description: RND-02
        productionPlan:
          type: string
          nullable: true
          description: RND-11 production steps (e.g. separated by `>`); non-whitespace required for task complete.
        rndNote:
          type: string
          nullable: true
          description: RND-05
        layoutCode:
          type: string
          nullable: true
        layoutQuoteCode:
          type: string
          nullable: true
        dieCode:
          type: string
          nullable: true
        dieQuoteCode:
          type: string
          nullable: true
    QaData:
      type: object
      required: [qaLineData]
      description: Per-line QA rows (`quotation_line_qa`), ordered by `lineNumber`.
      properties:
        qaLineData:
          type: array
          items:
            $ref: "#/components/schemas/QaLineItemData"
          description: One element per current-cycle line; may be `[]` before fill or when there are no lines.
      example:
        qaLineData:
          - lineNumber: 1
            qualityAssessmentResult: Đạt
            burstStandard: "≥ 800 kPa"
            compressionStandard: "≥ 4000 N"
            weightLimitStandard: "≤ 15 kg"
            kcgStandard: Đạt Tiger spec
            kcgQaSxProposal1: Đề xuất 1
            kcgQaSxProposal2: Đề xuất 2
            kcgQaSxProposal3: null
