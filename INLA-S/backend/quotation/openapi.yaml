          type: string
          format: uuid
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finalQuotationValue:
          type: number
          nullable: true
          description: From current cycle `quotation_accounting_data` when present (list joins).
    SalesData:
      type: object
      description: |
        Cycle-level Sales header (delivery location, notes, legacy optional carton fields).
        Carton spec for submit is validated on **lineItems** (PRICE-FORMAT / LIN-02…08), not single-row SAL dimensions.
      properties:
        boxType:
          type: string
          deprecated: true
        lengthMm:
          type: number
          deprecated: true
        widthMm:
          type: number
          deprecated: true
        heightMm:
          type: number
          deprecated: true
        dimensionType:
          type: string
          enum: [inner, outer]
          deprecated: true
        material:
          type: string
          deprecated: true
        layerCount:
          type: integer
          deprecated: true
        fluteType:
          type: string
          deprecated: true
        productLoadKg:
          type: number
          deprecated: true
        printingDescription:
          type: string
          deprecated: true
        printColorCount:
          type: integer
          deprecated: true
        printSideCount:
          type: integer
          deprecated: true
        quantityPieces:
          type: integer
          deprecated: true
        deliveryLocation:
          type: string
        desiredDeliveryTime:
          type: string
        salesNote:
          type: string
        additionalRequirements:
          type: string
    LineItem:
      type: object
      required:
        - id
        - lineNumber
        - itemName
        - fluteType
        - lengthMm
        - widthMm
        - heightMm
        - quantity
      properties:
        id:
          type: string
          format: uuid
        lineNumber:
          type: integer
          minimum: 1
        itemCode:
          type: string
          nullable: true
          description: LIN-01 (optional on submit)
        itemName:
          type: string
        fluteType:
          type: string
        lengthMm:
          type: number
        widthMm:
          type: number
        heightMm:
          type: number
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          nullable: true
          description: LIN-07 / EXC-01 — EXECUTOR; required on complete consolidation
        lineRemark:
          type: string
          nullable: true
    LineItemSalesInput:
      type: object
      required: [itemName, fluteType, lengthMm, widthMm, heightMm, quantity]
      properties:
        lineNumber:
          type: integer
          minimum: 1
        itemCode:
          type: string
        itemName:
          type: string
        fluteType:
          type: string
        lengthMm:
          type: number
        widthMm:
          type: number
        heightMm:
          type: number
        quantity:
          type: integer
          minimum: 1
