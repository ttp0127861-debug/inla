          properties:
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/LineItemConsolidationPatch"
    CreateQuotationRequest:
      allOf:
        - type: object
          required: [customerId]
          properties:
            customerId:
              type: string
              format: uuid
            contactId:
              type: string
              format: uuid
              nullable: true
        - $ref: "#/components/schemas/SalesData"
        - type: object
          properties:
            lineItems:
              type: array
              description: Optional initial line items for the first cycle.
              items:
                $ref: "#/components/schemas/LineItemSalesInput"
    UpdateQuotationDraftRequest:
      allOf:
