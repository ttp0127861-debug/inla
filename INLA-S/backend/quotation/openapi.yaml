      type: object
      required: [qaLineData]
      properties:
        qaLineData:
          type: array
          items:
            $ref: "#/components/schemas/QaLineItemData"
    RndData:
      type: object
      required: [rndLineData]
      description: Per-line R&D rows (`quotation_line_rnd`), ordered by `lineNumber`.
      properties:
        rndLineData:
          type: array
          items:
            $ref: "#/components/schemas/RndLineItemData"
          description: One element per current-cycle line.
      example:
        rndLineData:
          - lineNumber: 1
            printingPlateCost: 1500000
            dieCost: 800000
            productionPlan: in cuộn > sóng > bế > đóng pallet
