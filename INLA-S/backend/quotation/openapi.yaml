          type: string
          format: uuid
        code:
          type: string
        salesOwnerUsername:
          type: string
        customerId:
          type: string
          format: uuid
        customerCode:
          type: string
        customerName:
          type: string
        contactId:
          type: string
          format: uuid
          nullable: true
        workflowStatus:
          $ref: "#/components/schemas/WorkflowStatus"
        businessOutcome:
          $ref: "#/components/schemas/BusinessOutcome"
