openapi: 3.0.3
info:
  title: INLA-S Quotation
  version: "1.0.0"
  description: |
    Quotation MVP — workflow, tasks/SLA, role payloads, attachments (S3), history, clone/re-submit, outcome.

    HTTP API v2 → Lambda `src/index.handler` via `event.routeKey`. Path `{code}` = `BG-######`. JSON camelCase.

    **Authorization:** SALES owner scope (QUO-004); global read for EXECUTOR/QA/R&D/ACCOUNTING/DIRECTOR/ADMIN (QUO-005);
    **ADMIN read-only** on workflow mutations. Writes use `runWithRequestContext` (no JS `audit_events` inserts).

    **Optimistic lock:** send `version` on PUT draft, submit, resubmit/submit, business-outcome, director/decision → 409 if stale.

    **Env:** `ATTACHMENTS_BUCKET`, `AWS_REGION`, optional `ATTACHMENTS_ENABLED=true` for ATT minimums on task complete.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: api.example.com
security:
  - cognitoAccessToken: []
tags:
  - name: Quotations
  - name: Workflow
  - name: Tasks
  - name: RoleData
  - name: Attachments
  - name: History
  - name: CustomerTab
  - name: Reports
paths:
  /tasks:
    get:
      operationId: listTaskInbox
      tags: [Tasks]
      summary: Task inbox (open tasks on active workflow stages)
      description: |
        Replaces client N+1 (`GET /quotations` + `GET /quotations/{code}` per row).
        Returns open tasks (`pending` / `in_progress`) on the **current cycle** for quotations in active workflow stages.
        Task types are scoped by JWT role (ADMIN = all types; SALES = owner quotations, all task types like FE fallback).
        `slaAlertState` is computed on read (50% elapsed → `warning`, past deadline → `overdue`).
        Sort: overdue → warning → normal, then `slaDeadlineAt` ascending.
      parameters:
        - $ref: "#/components/parameters/SlaAlertState"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInboxResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /quotations:
    get:
      operationId: listQuotations
      tags: [Quotations]
      summary: List quotations
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/WorkflowStatus"
        - $ref: "#/components/parameters/BusinessOutcome"
        - $ref: "#/components/parameters/CycleType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createQuotation
      tags: [Quotations]
      summary: Create draft quotation (SALES)
      description: Creates quotation + cycle #1 (`new`) + `quotation_sales_data`. Owner from JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /quotations/{code}:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    get:
      operationId: getQuotation
      tags: [Quotations]
      summary: Get quotation aggregate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateQuotationDraft
      tags: [Quotations]
      summary: Update draft (SALES owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationDraftRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
        "409": { $ref: "#/components/responses/Conflict" }
  /quotations/{code}/cancel:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: cancelQuotationDraft
      tags: [Quotations]
      summary: Cancel draft (SALES owner)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/submit:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: submitQuotation
      tags: [Workflow]
      summary: Submit current draft cycle (SALES owner)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/resubmit/prepare:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: prepareResubmit
      tags: [Workflow]
      summary: Open re-submit draft cycle (SALES owner)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/resubmit/submit:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: submitResubmit
      tags: [Workflow]
      summary: Submit re-submit cycle (SALES owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resubmitReason]
              properties:
                resubmitReason:
                  type: string
                version:
                  type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/clone:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: cloneQuotation
      tags: [Workflow]
      summary: Clone to new draft quotation (SALES owner)
      description: Copies sales carton fields only. Attachment copy is planned for PR2.
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/business-outcome:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    patch:
      operationId: updateBusinessOutcome
      tags: [Workflow]
      summary: Update business outcome (SALES owner, approved only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessOutcome]
              properties:
                businessOutcome:
                  $ref: "#/components/schemas/BusinessOutcome"
                version:
                  type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/tasks/{taskType}/start:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - $ref: "#/components/parameters/TaskType"
    post:
      operationId: startTask
      tags: [Tasks]
      summary: Start workflow task (matching role)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/tasks/{taskType}/complete:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - $ref: "#/components/parameters/TaskType"
    post:
      operationId: completeTask
      tags: [Tasks]
      summary: Complete workflow task (matching role)
      description: |
        **Do not** complete `director_review` here — use `POST /quotations/{code}/director/decision` (409 otherwise).

        **QA (`qa_review`):** each current-cycle `quotation_line_items` row must have a matching `qaData.qaLineData[]`
        entry (`lineNumber` = `line_number`). Per line: non-empty **QA-09…12** (`burstStandard`…`kcgStandard`),
        **QA-13** (`kcgQaSxProposal1`), and **at least one** of **QA-14 / QA-15** (`kcgQaSxProposal2` or `kcgQaSxProposal3`).

        **R&D (`rnd_review`):** each line must have a matching `rndData.rndLineData[]` entry. Per line:
        `printingPlateCost` and `dieCost` ≥ 0 (required for complete), non-whitespace `productionPlan` (RND-11).

        Consolidation: **unitPrice on every line item** (LIN-07). Accounting: `finalQuotationValue`.
        Attachment minimums (QA/R&D/consolidation) apply when `ATTACHMENTS_ENABLED=true`.
        QA+RND → `executor_consolidation` only when both tasks complete (one workflow transition event).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/qa:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    put:
      operationId: updateQaData
      tags: [RoleData]
      summary: Save QA payload (QA)
      description: |
        **Full replace** of `qaLineData` for the current cycle. Body must include `qaLineData` (array).
        Length and `lineNumber` set must match `lineItems` for the cycle (sorted `line_number`); use `[]` only when the cycle has no lines.
        Persisted on `quotation_line_qa` (one row per line), joined by `lineNumber`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaDataPut"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/rnd:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    put:
      operationId: updateRndData
      tags: [RoleData]
      summary: Save R&D payload (R&D)
      description: |
        **Full replace** of `rndLineData` for the current cycle. Body must include `rndLineData` (array).
        Same line-count / `lineNumber` rules as QA. Persisted on `quotation_line_rnd`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RndDataPut"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/development-minutes:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    get:
      operationId: getDevelopmentMinutes
      tags: [RoleData]
      summary: BM03 development minutes for current cycle (quotation read scope)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentMinutes"
                nullable: true
    put:
      operationId: updateDevelopmentMinutes
      tags: [RoleData]
      summary: Save BM03 development minutes (R&D only; ADMIN read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentMinutesInput"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/executor/intake:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    put:
      operationId: updateExecutorIntake
      tags: [RoleData]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/executor/consolidation:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    put:
      operationId: updateExecutorConsolidation
      tags: [RoleData]
      summary: EXECUTOR consolidation header (EXC-05/06) and per-line price/remark (LIN-07/09)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorConsolidationPayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/accounting:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    put:
      operationId: updateAccountingData
      tags: [RoleData]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/director/decision:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: directorDecision
      tags: [RoleData]
      summary: Per-line approve or reject (DIRECTOR only)
      description: |
        **DIRECTOR** only, while `workflow_status = director_review`. One decision per current-cycle line.
        Any line `rejected` → quotation `rejected`; all lines `approved` → quotation `approved`.
        `rejectionReason` required on each rejected line.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectorDecisionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationDetailResponse"
  /quotations/{code}/attachments:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    get:
      operationId: listAttachments
      tags: [Attachments]
      parameters:
        - name: cycleId
          in: query
          schema:
            type: string
            format: uuid
        - name: section
          in: query
          schema:
            $ref: "#/components/schemas/AttachmentSection"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [attachments, page, pageSize, total]
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
                  page:
                    type: integer
                    default: 1
                  pageSize:
                    type: integer
                    default: 20
                  total:
                    type: integer
  /quotations/{code}/attachments/presign:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: presignAttachment
      tags: [Attachments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignAttachmentRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  storageKey:
                    type: string
                  expiresInSeconds:
                    type: integer
  /quotations/{code}/attachments/confirm:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    post:
      operationId: confirmAttachment
      tags: [Attachments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PresignAttachmentRequest"
                - type: object
                  required: [storageKey]
                  properties:
                    storageKey:
                      type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
  /quotations/{code}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAttachment
      tags: [Attachments]
      summary: Soft-delete own attachment
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /quotations/{code}/history:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    get:
      operationId: listQuotationHistory
      tags: [History]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
  /quotations/{code}/revisions:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    get:
      operationId: listRevisions
      tags: [History]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [revisions, page, pageSize, total]
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Revision"
                  page:
                    type: integer
                    default: 1
                  pageSize:
                    type: integer
                    default: 20
                  total:
                    type: integer
  /quotations/{code}/revisions/{revisionCode}:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
      - name: revisionCode
        in: path
        required: true
        schema:
          type: string
          example: REV-01
    get:
      operationId: getRevision
      tags: [History]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: "#/components/schemas/Revision"
                  snapshot:
                    type: object
  /quotations/{code}/similar-by-product:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    get:
      operationId: similarByProduct
      tags: [History]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationListResponse"
  /quotations/{code}/similar-by-customer:
    parameters:
      - $ref: "#/components/parameters/QuotationCode"
    get:
      operationId: similarByCustomer
      tags: [History]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationListResponse"
  /customers/{customerCode}/quotations:
    parameters:
      - name: customerCode
        in: path
        required: true
        schema:
          type: string
          pattern: "^KH-\\d{6,}$"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    get:
      operationId: listCustomerQuotations
      tags: [CustomerTab]
      summary: Quotations for customer (SALES = own only)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationListResponse"
  /reports/operations:
    get:
      operationId: getOperationsReport
      tags: [Reports]
      summary: RPT-01 — workflow status counts in period
      description: |
        Read-only operations report. Counts quotations by current `workflowStatus` where
        **`quotations.created_at`** falls in `[fromDate, toDate]` (inclusive calendar days, UTC).
        Default range when omitted: last 30 days (OQ-RPT-02).

        **Scope:** SALES sees own quotations (`salesOwnerUsername`); other quotation roles see all.
        Optional `department` limits to quotations whose **current cycle** has a task of that `taskType`.

        Period anchor and win-rate denominators may change when OQ-RPT-05/06 are finalized.
      parameters:
        - $ref: "#/components/parameters/ReportFromDate"
        - $ref: "#/components/parameters/ReportToDate"
        - $ref: "#/components/parameters/ReportDepartment"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /reports/business:
    get:
      operationId: getBusinessReport
      tags: [Reports]
      summary: RPT-02 — sent, won, lost, win rate, total won value
      description: |
        Business outcome KPIs for quotations created in the reporting period (`quotations.created_at`).
        **`sent`** = `sent_to_customer` + `won` + `lost`; **`winRate`** = `won / sent` when `sent > 0` (OQ-RPT-05 pending).
        **`totalWonValue`** sums `finalQuotationValue` from the latest **approved** workflow cycle per won quotation (OQ-RPT-06 assumption).
        SALES scope: own quotations only.
      parameters:
        - $ref: "#/components/parameters/ReportFromDate"
        - $ref: "#/components/parameters/ReportToDate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessReportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /reports/departments:
    get:
      operationId: getDepartmentsReport
      tags: [Reports]
      summary: RPT-03 — average task duration vs SLA by department
      description: |
        Completed tasks (`taskStatus = completed`) with `completedAt` in the reporting window,
        joined to quotations in scope. **`avgDurationHours`** uses `completedAt - startedAt`;
        **`avgSlaHours`** uses snapshotted `slaDurationHours`.

        **SALES → 403** (matches frontend `canAccessReportTab`). Optional `department` filters to one `taskType`.
      parameters:
        - $ref: "#/components/parameters/ReportFromDate"
        - $ref: "#/components/parameters/ReportToDate"
        - $ref: "#/components/parameters/ReportDepartment"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentsReportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /reports/resubmit:
    get:
      operationId: getResubmitReport
      tags: [Reports]
      summary: RPT-04 — re-submit rate, average cycles, monthly series
      description: |
        Quotations created in period with at least one submitted cycle.
        **`avgResubmitRate`** = share of those quotations that have a `re_submit` cycle.
        **`avgCyclesPerQuotation`** = mean submitted cycle count per quotation.
        **`monthlySeries`** groups by month of `workflow_cycles.submitted_at` in the date window.
        SALES scope: own quotations only.
      parameters:
        - $ref: "#/components/parameters/ReportFromDate"
        - $ref: "#/components/parameters/ReportToDate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResubmitReportResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    QuotationCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^BG-\\d{6,}$"
    TaskType:
      name: taskType
      in: path
      required: true
      schema:
        type: string
        enum:
          - executor_intake
          - qa_review
          - rnd_review
          - executor_consolidation
          - accounting_review
          - director_review
    Query:
      name: q
      in: query
      schema:
        type: string
    WorkflowStatus:
      name: workflowStatus
      in: query
      schema:
        $ref: "#/components/schemas/WorkflowStatus"
    BusinessOutcome:
      name: businessOutcome
      in: query
      schema:
        $ref: "#/components/schemas/BusinessOutcome"
    CycleType:
      name: cycleType
      in: query
      schema:
        type: string
        enum: [new, re_submit]
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size for list endpoints. Default 20 when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SlaAlertState:
      name: slaAlertState
      in: query
      schema:
        $ref: "#/components/schemas/SlaAlertState"
    ReportFromDate:
      name: fromDate
      in: query
      description: ISO date (YYYY-MM-DD). Default = today − 30 days (OQ-RPT-02).
      schema:
        type: string
        format: date
    ReportToDate:
      name: toDate
      in: query
      description: ISO date (YYYY-MM-DD). Default = today (UTC).
      schema:
        type: string
        format: date
    ReportDepartment:
      name: department
      in: query
      description: Filter by workflow task type (department). Used on operations and departments reports.
      schema:
        type: string
        enum:
          - executor_intake
          - qa_review
          - rnd_review
          - executor_consolidation
          - accounting_review
          - director_review
  schemas:
    ReportPeriodMeta:
      type: object
      required: [fromDate, toDate, periodAnchor]
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        periodAnchor:
          type: string
          enum: [quotationCreatedAt]
          description: Interim anchor; may change when OQ-RPT-05/06 close.
    OperationsReportResponse:
      allOf:
        - $ref: "#/components/schemas/ReportPeriodMeta"
        - type: object
          required: [total, byWorkflowStatus]
          properties:
            total:
              type: integer
            byWorkflowStatus:
              type: array
              items:
                type: object
                required: [workflowStatus, count]
                properties:
                  workflowStatus:
                    $ref: "#/components/schemas/WorkflowStatus"
                  count:
                    type: integer
    BusinessReportResponse:
      allOf:
        - $ref: "#/components/schemas/ReportPeriodMeta"
        - type: object
          required: [sent, won, lost, totalWonValue]
          properties:
            sent:
              type: integer
              description: sent_to_customer + won + lost
            won:
              type: integer
            lost:
              type: integer
            winRate:
              type: number
              nullable: true
              description: won / sent when sent > 0 (OQ-RPT-05 pending)
            totalWonValue:
              type: number
              description: VNĐ; latest approved cycle per won quotation (OQ-RPT-06)
    DepartmentReportRow:
      type: object
      required: [taskType, departmentLabel, completedTasks, overSlaCount]
      properties:
        taskType:
          type: string
        departmentLabel:
          type: string
        avgDurationHours:
          type: number
          nullable: true
        avgSlaHours:
          type: number
          nullable: true
        completedTasks:
          type: integer
        overSlaCount:
          type: integer
    DepartmentsReportResponse:
      allOf:
        - $ref: "#/components/schemas/ReportPeriodMeta"
        - type: object
          required: [departments]
          properties:
            departments:
              type: array
              items:
                $ref: "#/components/schemas/DepartmentReportRow"
    ResubmitMonthlyPoint:
      type: object
      required: [month, submittedQuotations, quotationsWithResubmit]
      properties:
        month:
          type: string
          description: YYYY-MM
        submittedQuotations:
          type: integer
        quotationsWithResubmit:
          type: integer
        resubmitRate:
          type: number
          nullable: true
    ResubmitReportResponse:
      allOf:
        - $ref: "#/components/schemas/ReportPeriodMeta"
        - type: object
          required: [monthlySeries]
          properties:
            avgResubmitRate:
              type: number
              nullable: true
            avgCyclesPerQuotation:
              type: number
              nullable: true
            submittedQuotations:
              type: integer
            quotationsWithResubmit:
              type: integer
            monthlySeries:
              type: array
              items:
                $ref: "#/components/schemas/ResubmitMonthlyPoint"
    SlaAlertState:
      type: string
      enum: [normal, warning, overdue]
    WorkflowStatus:
      type: string
      enum:
        - draft
        - cancelled
        - executor_intake
        - qa_rnd_review
        - executor_consolidation
        - accounting_review
        - director_review
        - approved
        - rejected
    BusinessOutcome:
      type: string
      enum: [not_updated, sent_to_customer, won, lost]
    Quotation:
      type: object
      properties:
