    post:
      operationId: directorDecision
      tags:
        - INLA-S_Quotation_RoleData
      summary: Per-line approve or reject (DIRECTOR only)
      description: >
        **DIRECTOR** only, while `workflow_status = director_review`. One
        decision per current-cycle line.

        Any line `rejected` → quotation `rejected`; all lines `approved` →
        quotation `approved`.

        `rejectionReason` required on each rejected line.
      requestBody:
