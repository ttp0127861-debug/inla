  /quotations/{code}/tasks/{taskType}/start:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - $ref: '#/components/parameters/INLA-S_Quotation_TaskType'
    post:
      operationId: startTask
      tags:
        - INLA-S_Quotation_Tasks
      summary: Start workflow task (matching role)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationDetailResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/tasks/{taskType}/complete:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - $ref: '#/components/parameters/INLA-S_Quotation_TaskType'
    post:
      operationId: completeTask
      tags:
        - INLA-S_Quotation_Tasks
      summary: Complete workflow task (matching role)
      description: >
        **Do not** complete `director_review` here — use `POST
        /quotations/{code}/director/decision` (409 otherwise).


        **QA (`qa_review`):** each current-cycle `quotation_line_items` row must
        have a matching `qaData.qaLineData[]`

        entry (`lineNumber` = `line_number`). Per line: non-empty **QA-09…12**
        (`burstStandard`…`kcgStandard`),

        **QA-13** (`kcgQaSxProposal1`), and **at least one** of **QA-14 /
        QA-15** (`kcgQaSxProposal2` or `kcgQaSxProposal3`).


        **R&D (`rnd_review`):** each line must have a matching
        `rndData.rndLineData[]` entry. Per line:

        `printingPlateCost` and `dieCost` ≥ 0 (required for complete),
        non-whitespace `productionPlan` (RND-11).


        Consolidation: **unitPrice on every line item** (LIN-07). Accounting:
        `finalQuotationValue`.

        Attachment minimums (QA/R&D/consolidation) apply when
        `ATTACHMENTS_ENABLED=true`.

        QA+RND → `executor_consolidation` only when both tasks complete (one
        workflow transition event).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationDetailResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/qa:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    put:
      operationId: updateQaData
      tags:
        - INLA-S_Quotation_RoleData
      summary: Save QA payload (QA)
      description: >
        **Full replace** of `qaLineData` for the current cycle. Body must
        include `qaLineData` (array).

        Length and `lineNumber` set must match `lineItems` for the cycle (sorted
        `line_number`); use `[]` only when the cycle has no lines.

        Persisted on `quotation_line_qa` (one row per line), joined by
        `lineNumber`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Quotation_QaDataPut'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationDetailResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/rnd:
