        - $ref: '#/components/parameters/INLA-S_Quotation_Page'
        - $ref: '#/components/parameters/INLA-S_Quotation_PageSize'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - attachments
                  - page
                  - pageSize
                  - total
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/INLA-S_Quotation_Attachment'
                  page:
                    type: integer
                    default: 1
                  pageSize:
                    type: integer
                    default: 20
                  total:
                    type: integer
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/attachments/presign:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    post:
      operationId: presignAttachment
      tags:
        - INLA-S_Quotation_Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Quotation_PresignAttachmentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  storageKey:
                    type: string
                  expiresInSeconds:
                    type: integer
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/attachments/confirm:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    post:
      operationId: confirmAttachment
      tags:
        - INLA-S_Quotation_Attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: >-
                    #/components/schemas/INLA-S_Quotation_PresignAttachmentRequest
                - type: object
                  required:
                    - storageKey
                  properties:
                    storageKey:
                      type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: '#/components/schemas/INLA-S_Quotation_Attachment'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAttachment
      tags:
        - INLA-S_Quotation_Attachments
      summary: Soft-delete own attachment
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/history:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - $ref: '#/components/parameters/INLA-S_Quotation_Page'
      - $ref: '#/components/parameters/INLA-S_Quotation_PageSize'
    get:
      operationId: listQuotationHistory
      tags:
        - INLA-S_Quotation_History
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_HistoryResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/revisions:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - $ref: '#/components/parameters/INLA-S_Quotation_Page'
      - $ref: '#/components/parameters/INLA-S_Quotation_PageSize'
    get:
      operationId: listRevisions
      tags:
        - INLA-S_Quotation_History
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - revisions
                  - page
                  - pageSize
                  - total
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/INLA-S_Quotation_Revision'
                  page:
                    type: integer
                    default: 1
                  pageSize:
                    type: integer
                    default: 20
                  total:
                    type: integer
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/revisions/{revisionCode}:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
      - name: revisionCode
        in: path
        required: true
        schema:
          type: string
          example: REV-01
    get:
      operationId: getRevision
      tags:
        - INLA-S_Quotation_History
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    $ref: '#/components/schemas/INLA-S_Quotation_Revision'
                  snapshot:
                    type: object
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/similar-by-product:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    get:
      operationId: similarByProduct
      tags:
        - INLA-S_Quotation_History
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationListResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /quotations/{code}/similar-by-customer:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    get:
      operationId: similarByCustomer
      tags:
        - INLA-S_Quotation_History
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationListResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /customers/{customerCode}/quotations:
    parameters:
      - name: customerCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^KH-\d{6,}$
      - $ref: '#/components/parameters/INLA-S_Quotation_Page'
      - $ref: '#/components/parameters/INLA-S_Quotation_PageSize'
    get:
      operationId: listCustomerQuotations
      tags:
        - INLA-S_Quotation_CustomerTab
      summary: Quotations for customer (SALES = own only)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_QuotationListResponse'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /reports/operations:
    get:
      operationId: getOperationsReport
      tags:
        - INLA-S_Quotation_Reports
      summary: RPT-01 — workflow status counts in period
      description: >
        Read-only operations report. Counts quotations by current
        `workflowStatus` where

        **`quotations.created_at`** falls in `[fromDate, toDate]` (inclusive
        calendar days, UTC).

        Default range when omitted: last 30 days (OQ-RPT-02).


        **Scope:** SALES sees own quotations (`salesOwnerUsername`); other
        quotation roles see all.

        Optional `department` limits to quotations whose **current cycle** has a
        task of that `taskType`.


        Period anchor and win-rate denominators may change when OQ-RPT-05/06 are
        finalized.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportFromDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportToDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportDepartment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_OperationsReportResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Quotation_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Quotation_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Quotation_Forbidden'
        '500':
          $ref: '#/components/responses/INLA-S_Quotation_InternalError'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /reports/business:
    get:
      operationId: getBusinessReport
      tags:
        - INLA-S_Quotation_Reports
      summary: RPT-02 — sent, won, lost, win rate, total won value
      description: >
        Business outcome KPIs for quotations created in the reporting period
        (`quotations.created_at`).

        **`sent`** = `sent_to_customer` + `won` + `lost`; **`winRate`** = `won /
        sent` when `sent > 0` (OQ-RPT-05 pending).

        **`totalWonValue`** sums `finalQuotationValue` from the latest
        **approved** workflow cycle per won quotation (OQ-RPT-06 assumption).

        SALES scope: own quotations only.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportFromDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportToDate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_BusinessReportResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Quotation_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Quotation_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Quotation_Forbidden'
        '500':
          $ref: '#/components/responses/INLA-S_Quotation_InternalError'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /reports/departments:
    get:
      operationId: getDepartmentsReport
      tags:
        - INLA-S_Quotation_Reports
      summary: RPT-03 — average task duration vs SLA by department
      description: >
        Completed tasks (`taskStatus = completed`) with `completedAt` in the
        reporting window,

        joined to quotations in scope. **`avgDurationHours`** uses `completedAt
        - startedAt`;

        **`avgSlaHours`** uses snapshotted `slaDurationHours`.


        **SALES → 403** (matches frontend `canAccessReportTab`). Optional
        `department` filters to one `taskType`.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportFromDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportToDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportDepartment'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/INLA-S_Quotation_DepartmentsReportResponse
        '400':
          $ref: '#/components/responses/INLA-S_Quotation_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Quotation_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Quotation_Forbidden'
        '500':
          $ref: '#/components/responses/INLA-S_Quotation_InternalError'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
  /reports/resubmit:
    get:
      operationId: getResubmitReport
      tags:
        - INLA-S_Quotation_Reports
      summary: RPT-04 — re-submit rate, average cycles, monthly series
      description: >
        Quotations created in period with at least one submitted cycle.

        **`avgResubmitRate`** = share of those quotations that have a
        `re_submit` cycle.

        **`avgCyclesPerQuotation`** = mean submitted cycle count per quotation.

        **`monthlySeries`** groups by month of `workflow_cycles.submitted_at` in
        the date window.

        SALES scope: own quotations only.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportFromDate'
        - $ref: '#/components/parameters/INLA-S_Quotation_ReportToDate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Quotation_ResubmitReportResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Quotation_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Quotation_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Quotation_Forbidden'
        '500':
          $ref: '#/components/responses/INLA-S_Quotation_InternalError'
      security:
        - INLA-S_Quotation_cognitoAccessToken: []
components:
  securitySchemes:
    INLA-S_Users_cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Cognito access token sent in the `Authorization` header.

        API Gateway is the JWT authorizer. The Lambda reads
        `requestContext.authorizer.jwt.claims`

        and requires the `ADMIN` group.
    INLA-S_Customer_cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token (API Gateway JWT authorizer).
    INLA-S_Quotation_cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    INLA-S_Users_Username:
      name: username
      in: path
      required: true
      description: |
        Cognito username. Users created by this API use the email address.
        The value is URL-decoded and trimmed. An empty value is rejected.
      schema:
        type: string
        minLength: 1
      example: person@inla.vn
    INLA-S_Users_Query:
      name: q
      in: query
      required: false
      description: >
        Case-insensitive substring matched against `name`, `email`,
        `phoneNumber`, and `username`.

        Blank and whitespace-only values do not filter the list.
      schema:
        type: string
      example: nguyen
    INLA-S_Users_Role:
      name: role
      in: query
      required: false
      description: >
        Exact match on the user's resolved role.

        A value that is not one of the known roles matches nobody and yields an
        empty list.
      schema:
        $ref: '#/components/schemas/INLA-S_Users_RoleName'
    INLA-S_Users_Enabled:
      name: enabled
      in: query
      required: false
      description: |
        `true` returns only enabled users. `false` returns only disabled users.
        Any other value is ignored and does not filter the list.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    INLA-S_Users_Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    INLA-S_Users_PageSize:
      name: pageSize
      in: query
      description: Page size for list endpoints. Default 20 when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    INLA-S_Customer_CustomerCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        example: KH-000128
    INLA-S_Customer_ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    INLA-S_Customer_SalesUsername:
      name: salesUsername
      in: path
      required: true
      schema:
        type: string
        description: Cognito username (usually email), lowercase.
    INLA-S_Customer_Query:
      name: q
      in: query
      schema:
        type: string
      description: Case-insensitive match on name, code, taxId, or email.
    INLA-S_Customer_CustomerType:
      name: customerType
      in: query
      schema:
        $ref: '#/components/schemas/INLA-S_Customer_CustomerType'
    INLA-S_Customer_Province:
      name: province
      in: query
      schema:
        type: string
    INLA-S_Customer_Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/INLA-S_Customer_EntityStatus'
    INLA-S_Customer_Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    INLA-S_Customer_PageSize:
      name: pageSize
      in: query
      description: Page size for list endpoints. Default 20 when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    INLA-S_Quotation_QuotationCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^BG-\d{6,}$
    INLA-S_Quotation_TaskType:
      name: taskType
      in: path
      required: true
      schema:
        type: string
        enum:
          - executor_intake
          - qa_review
          - rnd_review
          - executor_consolidation
          - accounting_review
          - director_review
    INLA-S_Quotation_Query:
      name: q
      in: query
      schema:
        type: string
    INLA-S_Quotation_WorkflowStatus:
      name: workflowStatus
      in: query
      schema:
        $ref: '#/components/schemas/INLA-S_Quotation_WorkflowStatus'
    INLA-S_Quotation_BusinessOutcome:
      name: businessOutcome
      in: query
      schema:
        $ref: '#/components/schemas/INLA-S_Quotation_BusinessOutcome'
    INLA-S_Quotation_CycleType:
      name: cycleType
      in: query
      schema:
        type: string
        enum:
          - new
          - re_submit
    INLA-S_Quotation_Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    INLA-S_Quotation_PageSize:
      name: pageSize
      in: query
      description: Page size for list endpoints. Default 20 when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    INLA-S_Quotation_SlaAlertState:
      name: slaAlertState
      in: query
      schema:
        $ref: '#/components/schemas/INLA-S_Quotation_SlaAlertState'
    INLA-S_Quotation_ReportFromDate:
      name: fromDate
      in: query
      description: ISO date (YYYY-MM-DD). Default = today − 30 days (OQ-RPT-02).
      schema:
        type: string
        format: date
    INLA-S_Quotation_ReportToDate:
      name: toDate
      in: query
      description: ISO date (YYYY-MM-DD). Default = today (UTC).
      schema:
        type: string
        format: date
    INLA-S_Quotation_ReportDepartment:
      name: department
      in: query
      description: >-
        Filter by workflow task type (department). Used on operations and
        departments reports.
      schema:
        type: string
        enum:
          - executor_intake
          - qa_review
          - rnd_review
          - executor_consolidation
          - accounting_review
          - director_review
  schemas:
    INLA-S_Users_RoleName:
      type: string
      description: Cognito group used as the user's single role.
      enum:
        - ADMIN
        - DIRECTOR
        - EXECUTOR
        - SALES
        - QA
        - R&D
        - ACCOUNTING
    INLA-S_Users_Level:
      type: string
      description: Stored in the Cognito attribute `custom:level`.
      enum:
        - manager
        - staff
    INLA-S_Users_Role:
      type: object
      required:
        - name
        - description
      properties:
        name:
          $ref: '#/components/schemas/INLA-S_Users_RoleName'
        description:
          type: string
          description: Cognito group description. Empty when the group has none.
        precedence:
          type: integer
          description: Cognito group precedence. Omitted when the group has no precedence.
    INLA-S_Users_RoleList:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/INLA-S_Users_Role'
    INLA-S_Users_User:
      type: object
      required:
        - username
        - email
        - name
        - phoneNumber
        - level
        - role
        - enabled
        - status
      properties:
        username:
          type: string
          description: Cognito username. For users created here, this is the email.
        email:
          type: string
          description: >-
            Cognito `email` attribute, or the username when that attribute is
            absent.
        name:
          type: string
          description: Cognito `name` attribute. Empty when the attribute is absent.
        phoneNumber:
          type: string
          description: >-
            Cognito `phone_number` attribute. E.164 when written by this API.
            Empty when the attribute is absent.
          example: '+84901234567'
        level:
          type: string
          description: >-
            Cognito `custom:level`. `manager` or `staff` when written by this
            API. Empty when the attribute is absent.
          example: staff
        role:
          type: string
          nullable: true
          enum:
            - ADMIN
            - DIRECTOR
            - EXECUTOR
            - SALES
            - QA
            - R&D
            - ACCOUNTING
          description: |
            The first of the user's groups that is a known role, in role order.
            Null when the user is in none of those groups.
        enabled:
          type: boolean
          description: Cognito enabled flag.
        status:
          type: string
          description: >
            Cognito `UserStatus`. Common values are `FORCE_CHANGE_PASSWORD`,
            `CONFIRMED`, and `RESET_REQUIRED`.
          example: CONFIRMED
    INLA-S_Users_UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/INLA-S_Users_User'
    INLA-S_Users_UserList:
      type: object
      required:
        - users
        - page
        - pageSize
        - total
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/INLA-S_Users_User'
        page:
          type: integer
          default: 1
        pageSize:
          type: integer
          default: 20
        total:
          type: integer
    INLA-S_Users_CreateUserRequest:
      type: object
      required:
        - email
        - name
        - phoneNumber
        - role
        - level
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: >
            Trimmed and lowercased. Must match one local part, `@`, and a domain
            containing a dot, with no spaces.

            This value becomes the Cognito username. `email_verified` is set to
            true.
          example: person@inla.vn
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Trimmed. Internal whitespace is collapsed to a single space.
            ASCII control characters (U+0000 through U+001F) are rejected.
          example: Nguyen Van A
        phoneNumber:
          type: string
          minLength: 1
          description: >
            Vietnam phone number. Spaces, parentheses, dots, and dashes are
            removed before validation.

            A leading `0` is replaced with country code `84`. A leading `+` is
            accepted.

            The remaining digits must be `84` followed by 8 to 11 digits.

            Cognito stores the E.164 form, such as `+84901234567` for
            `0901234567`.
          example: '0901234567'
        role:
          $ref: '#/components/schemas/INLA-S_Users_RoleName'
        level:
          $ref: '#/components/schemas/INLA-S_Users_Level'
    INLA-S_Users_UpdateUserRequest:
      type: object
      description: >
        At least one of `name`, `phoneNumber`, `role`, and `level` is required.

        Each supplied field uses the same validation as create.

        `email` is rejected with `Invalid email.` Properties other than these
        five are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Same validation as create.
          example: Nguyen Van A
        phoneNumber:
          type: string
          minLength: 1
          description: Same validation and E.164 normalization as create.
          example: '0901234567'
        role:
          $ref: '#/components/schemas/INLA-S_Users_RoleName'
        level:
          $ref: '#/components/schemas/INLA-S_Users_Level'
    INLA-S_Users_PasswordReset:
      type: object
      required:
        - username
        - message
      properties:
        username:
          type: string
          description: Path username after URL decoding and trimming.
        message:
          type: string
          enum:
            - Password reset email sent.
    INLA-S_Users_Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - EMAIL_FAILED
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
            message:
              type: string
    INLA-S_Users_GatewayMessage:
      type: object
      required:
        - message
      description: >-
        Body returned by API Gateway when the JWT authorizer rejects the request
        before the Lambda runs.
      properties:
        message:
          type: string
          example: Unauthorized
    INLA-S_Customer_CustomerType:
      type: string
      enum:
        - business
        - individual
    INLA-S_Customer_EntityStatus:
      type: string
      enum:
        - active
        - inactive
    INLA-S_Customer_RelationStatus:
      type: string
      enum:
        - active
        - inactive
    INLA-S_Customer_Customer:
      type: object
      required:
        - id
        - code
        - customerType
