      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Quotation_Error'
    INLA-S_Quotation_InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Quotation_Error'
