                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string
  responses:
    INLA-S_Users_BadRequest:
      description: >
        The body, a field, or a Cognito parameter is invalid.

        Lambda validation messages are `Invalid JSON body.`, `Invalid body.`,
        `Invalid username.`,

        `Invalid email.`, `Invalid name.`, `Invalid phoneNumber.`, `Invalid
        role.`, and `Invalid level.`

        Create checks those fields in that order. A non-object JSON body uses
        `Invalid body.`

        `InvalidParameterException` from Cognito uses Cognito's message with the
        same code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          examples:
            field:
              summary: Field validation
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid phoneNumber.
            json:
              summary: Body is not JSON
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid JSON body.
            emptyUpdate:
              summary: Update contains no fields
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid body.
    INLA-S_Users_Unauthorized:
      description: >
        The access token is missing or invalid, or the Lambda event has no
        Cognito claims.

        API Gateway returns `message` when the JWT authorizer rejects the call.

        The Lambda returns `error` when it is invoked without claims.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/INLA-S_Users_GatewayMessage'
              - $ref: '#/components/schemas/INLA-S_Users_Error'
          examples:
            gateway:
              summary: API Gateway rejected the token
              value:
                message: Unauthorized
            lambda:
              summary: Lambda received no claims
              value:
                error:
                  code: UNAUTHORIZED
                  message: A valid Cognito access token is required.
    INLA-S_Users_Forbidden:
      description: The caller is not in the ADMIN group, or Cognito rejected the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          examples:
            notAdmin:
              summary: Caller is not in ADMIN
              value:
                error:
                  code: FORBIDDEN
                  message: Only the ADMIN group can manage users.
            cognito:
              summary: Cognito rejected the operation
              value:
                error:
                  code: FORBIDDEN
                  message: Cognito rejected this operation.
    INLA-S_Users_NotFound:
      description: Cognito returned `UserNotFoundException` or `ResourceNotFoundException`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          example:
            error:
              code: NOT_FOUND
              message: User not found.
    INLA-S_Users_TooManyRequests:
      description: Cognito returned `TooManyRequestsException` or `LimitExceededException`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Too many requests. Try again later.
    INLA-S_Users_EmailFailed:
      description: Cognito returned `CodeDeliveryFailureException` while sending email.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          example:
            error:
              code: EMAIL_FAILED
              message: Cognito could not send the email.
    INLA-S_Users_InternalError:
      description: >
        `USER_POOL_ID` is not configured, or the Lambda caught an unexpected
        error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Users_Error'
          examples:
            missingPool:
              summary: USER_POOL_ID is unset
              value:
                error:
                  code: INTERNAL_ERROR
                  message: USER_POOL_ID is not configured.
            unexpected:
              summary: Unmapped exception
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Unexpected error.
    INLA-S_Customer_BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
    INLA-S_Customer_Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
    INLA-S_Customer_Forbidden:
      description: Caller is not ADMIN or SALES, or ADMIN-only route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
    INLA-S_Customer_NotFound:
      description: Resource not found or not visible to SALES
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
    INLA-S_Customer_Conflict:
      description: Unique constraint violation (duplicate tax ID / MST)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
          example:
            error:
              code: CONFLICT
              message: A customer with this tax ID (MST) already exists.
    INLA-S_Customer_InternalError:
      description: Missing DATABASE_URL or unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Customer_Error'
    INLA-S_Quotation_BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/INLA-S_Quotation_Error'
    INLA-S_Quotation_Unauthorized:
