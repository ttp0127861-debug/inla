openapi: 3.0.3
info:
  title: INLA-S Users
  version: 1.0.0
  description: >
    User administration for one Cognito user pool. API Gateway HTTP API invokes
    the users Lambda (`src/index.handler`).

    The pool id is the `USER_POOL_ID` environment variable. Routes are served
    from the API host with no stage prefix.


    API Gateway validates a Cognito access token on every route. The Lambda then
    allows only tokens whose `cognito:groups` claim includes `ADMIN`.


    Users written by this API have exactly one role. At most one enabled user
    may have the role `EXECUTOR`.

    `level` is stored in the Cognito attribute `custom:level`. Phone numbers are
    stored as E.164.

    This API has no delete route. A created user is deleted only to roll back a
    create that fails while the role is assigned.
servers:
  - url: https://{apiHost}
    description: >-
      Users HTTP API. The `$default` stage is implicit, so paths have no stage
      prefix.
    variables:
      apiHost:
        default: users-api.example.com
        description: Hostname of this HTTP API.
tags:
  - name: INLA-S_Users_Users
    description: Cognito user records and their single role group.
    x-displayName: Users
  - name: INLA-S_Users_Roles
    description: Cognito groups used as roles.
    x-displayName: Roles
  - name: INLA-S_Customer_Customers
    x-displayName: Customers
  - name: INLA-S_Customer_Contacts
    x-displayName: Contacts
  - name: INLA-S_Customer_Sales
    x-displayName: Sales
  - name: INLA-S_Customer_History
    x-displayName: History
  - name: INLA-S_Quotation_Quotations
    x-displayName: Quotations
  - name: INLA-S_Quotation_Workflow
    x-displayName: Workflow
  - name: INLA-S_Quotation_Tasks
    x-displayName: Tasks
  - name: INLA-S_Quotation_RoleData
    x-displayName: RoleData
  - name: INLA-S_Quotation_Attachments
    x-displayName: Attachments
  - name: INLA-S_Quotation_History
    x-displayName: History
  - name: INLA-S_Quotation_CustomerTab
    x-displayName: CustomerTab
  - name: INLA-S_Quotation_Reports
    x-displayName: Reports
paths:
  /roles:
    get:
      operationId: listRoles
      tags:
        - INLA-S_Users_Roles
      summary: List roles
      description: >
        Returns the Cognito groups whose names are roles, in this order:

        `ADMIN`, `DIRECTOR`, `EXECUTOR`, `SALES`, `QA`, `R&D`, `ACCOUNTING`.

        Groups that do not exist in the pool are omitted. Backed by
        `ListGroups`.
      responses:
        '200':
          description: Roles that exist in the user pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_RoleList'
              example:
                roles:
                  - name: ADMIN
                    description: Administer users
                    precedence: 1
                  - name: SALES
                    description: ''
                    precedence: 4
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /users:
    get:
      operationId: listUsers
      tags:
        - INLA-S_Users_Users
      summary: List users
      description: >
        Lists Cognito users and each user's role group (`ListUsers`, then
        `AdminListGroupsForUser`).

        Reading stops when the pool is exhausted or 1000 users have been read,
        then filters and paginates in memory.

        Default pagination: page 1, pageSize 20 when query params are omitted.

        Filters are combined. A user is included only when every supplied filter
        matches.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Users_Query'
        - $ref: '#/components/parameters/INLA-S_Users_Role'
        - $ref: '#/components/parameters/INLA-S_Users_Enabled'
        - $ref: '#/components/parameters/INLA-S_Users_Page'
        - $ref: '#/components/parameters/INLA-S_Users_PageSize'
      responses:
        '200':
          description: >-
            Users that match the filters. The array is empty when nothing
            matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserList'
              example:
                users:
                  - username: person@inla.vn
                    email: person@inla.vn
                    name: Nguyen Van A
                    phoneNumber: '+84901234567'
                    level: staff
                    role: SALES
                    enabled: true
                    status: CONFIRMED
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
    post:
      operationId: createUser
      tags:
        - INLA-S_Users_Users
      summary: Create a user
      description: >
        Creates a Cognito user with `AdminCreateUser`, using the email as the
        username, and emails a temporary password.

        The user is then added to the role group with `AdminAddUserToGroup`.

        If assigning the group fails, the new user is deleted with
        `AdminDeleteUser` and the original error is returned.

        Creating an `EXECUTOR` is rejected when another enabled `EXECUTOR`
        already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Users_CreateUserRequest'
            example:
              email: person@inla.vn
              name: Nguyen Van A
              phoneNumber: '0901234567'
              role: SALES
              level: staff
      responses:
        '201':
          description: The created user, including the assigned role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserResponse'
              example:
                user:
                  username: person@inla.vn
                  email: person@inla.vn
                  name: Nguyen Van A
                  phoneNumber: '+84901234567'
                  level: staff
                  role: SALES
                  enabled: true
                  status: FORCE_CHANGE_PASSWORD
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '409':
          description: >-
            The email is already a user, or another enabled EXECUTOR already
            exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_Error'
              examples:
                emailExists:
                  summary: Email already exists
                  value:
                    error:
                      code: CONFLICT
                      message: A user with this email already exists.
                executorExists:
                  summary: Active EXECUTOR already exists
                  value:
                    error:
                      code: CONFLICT
                      message: Only one active EXECUTOR is allowed.
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
        '502':
          $ref: '#/components/responses/INLA-S_Users_EmailFailed'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /users/{username}:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Users_Username'
    get:
      operationId: getUser
      tags:
        - INLA-S_Users_Users
      summary: Get a user
      description: >-
        Loads one Cognito user with `AdminGetUser` and that user's groups with
        `AdminListGroupsForUser`.
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserResponse'
              example:
                user:
                  username: person@inla.vn
                  email: person@inla.vn
                  name: Nguyen Van A
                  phoneNumber: '+84901234567'
                  level: staff
                  role: SALES
                  enabled: true
                  status: CONFIRMED
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
    put:
      operationId: updateUser
      tags:
        - INLA-S_Users_Users
      summary: Update a user
      description: >
        Updates `name`, `phone_number`, and `custom:level` with
        `AdminUpdateUserAttributes`.

        When `role` is present, other role groups are removed and the user is
        added to the new group.

        Email cannot be changed. Sending `email` returns 400 even if other
        fields are valid.

        At least one of `name`, `phoneNumber`, `role`, and `level` is required.

        Assigning `EXECUTOR` to a user who is currently enabled is rejected when
        another enabled `EXECUTOR` exists.

        Assigning `EXECUTOR` to a disabled user does not perform that check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Users_UpdateUserRequest'
            example:
              name: Nguyen Van A
              phoneNumber: '0901234567'
              role: SALES
              level: manager
      responses:
        '200':
          description: The user after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '409':
          description: The user is enabled and another enabled EXECUTOR already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_Error'
              example:
                error:
                  code: CONFLICT
                  message: Only one active EXECUTOR is allowed.
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /users/{username}/disable:
    post:
      operationId: disableUser
      tags:
        - INLA-S_Users_Users
      summary: Disable a user
      description: >
        Disables the Cognito user with `AdminDisableUser` and returns the
        updated user.

        If the user is already disabled, Cognito is not called again and the
        current user is returned.

        An admin cannot disable the account identified by their own `username`,
        `cognito:username`, or `email` claim.

        The comparison is case-insensitive. This route has no request body.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Users_Username'
      responses:
        '200':
          description: The user, with enabled set to false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserResponse'
              example:
                user:
                  username: person@inla.vn
                  email: person@inla.vn
                  name: Nguyen Van A
                  phoneNumber: '+84901234567'
                  level: staff
                  role: SALES
                  enabled: false
                  status: CONFIRMED
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          description: >-
            The caller is not an admin, is disabling their own account, or
            Cognito rejected the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_Error'
              examples:
                notAdmin:
                  summary: Caller is not in ADMIN
                  value:
                    error:
                      code: FORBIDDEN
                      message: Only the ADMIN group can manage users.
                self:
                  summary: Caller targeted their own account
                  value:
                    error:
                      code: FORBIDDEN
                      message: You cannot disable your own account.
                cognito:
                  summary: Cognito rejected the operation
                  value:
                    error:
                      code: FORBIDDEN
                      message: Cognito rejected this operation.
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /users/{username}/enable:
    post:
      operationId: enableUser
      tags:
        - INLA-S_Users_Users
      summary: Enable a user
      description: >
        Enables the Cognito user with `AdminEnableUser` and returns the updated
        user.

        If the user is already enabled, Cognito is not called again and the
        current user is returned.

        Enabling a disabled member of `EXECUTOR` is rejected when another
        enabled `EXECUTOR` exists.

        This route has no request body.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Users_Username'
      responses:
        '200':
          description: The user, with enabled set to true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_UserResponse'
              example:
                user:
                  username: person@inla.vn
                  email: person@inla.vn
                  name: Nguyen Van A
                  phoneNumber: '+84901234567'
                  level: staff
                  role: SALES
                  enabled: true
                  status: CONFIRMED
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '409':
          description: The user is an EXECUTOR and another enabled EXECUTOR already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_Error'
              example:
                error:
                  code: CONFLICT
                  message: Only one active EXECUTOR is allowed.
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /users/{username}/reset-password:
    post:
      operationId: resetUserPassword
      tags:
        - INLA-S_Users_Users
      summary: Reset a user's password
      description: >
        Confirms the user exists, then asks Cognito (`AdminResetUserPassword`)
        to email a password reset.

        This route has no request body. `username` in the response is the path
        value after decoding and trimming.
      parameters:
        - $ref: '#/components/parameters/INLA-S_Users_Username'
      responses:
        '200':
          description: Cognito accepted the reset and will email the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Users_PasswordReset'
              example:
                username: person@inla.vn
                message: Password reset email sent.
        '400':
          $ref: '#/components/responses/INLA-S_Users_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Users_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Users_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Users_NotFound'
        '429':
          $ref: '#/components/responses/INLA-S_Users_TooManyRequests'
        '500':
          $ref: '#/components/responses/INLA-S_Users_InternalError'
        '502':
          $ref: '#/components/responses/INLA-S_Users_EmailFailed'
      security:
        - INLA-S_Users_cognitoAccessToken: []
  /customers:
    get:
      operationId: listCustomers
      tags:
        - INLA-S_Customer_Customers
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/INLA-S_Customer_Query'
        - $ref: '#/components/parameters/INLA-S_Customer_CustomerType'
        - $ref: '#/components/parameters/INLA-S_Customer_Province'
        - $ref: '#/components/parameters/INLA-S_Customer_Status'
        - $ref: '#/components/parameters/INLA-S_Customer_Page'
        - $ref: '#/components/parameters/INLA-S_Customer_PageSize'
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerListResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Customer_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
    post:
      operationId: createCustomer
      tags:
        - INLA-S_Customer_Customers
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Customer_CreateCustomerRequest'
      responses:
        '201':
          description: Created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Customer_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '409':
          $ref: '#/components/responses/INLA-S_Customer_Conflict'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
  /customers/{code}:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Customer_CustomerCode'
    get:
      operationId: getCustomer
      tags:
        - INLA-S_Customer_Customers
      summary: Get customer by code
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerResponse'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
    put:
      operationId: updateCustomer
      tags:
        - INLA-S_Customer_Customers
      summary: Update customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Customer_UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Customer_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '409':
          $ref: '#/components/responses/INLA-S_Customer_Conflict'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
  /customers/{code}/deactivate:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Customer_CustomerCode'
    post:
      operationId: deactivateCustomer
      tags:
        - INLA-S_Customer_Customers
      summary: Deactivate customer (ADMIN)
      description: >-
        Sets customer `status` to `inactive`. Only callers in the **ADMIN**
        Cognito group may use this route.
      responses:
        '200':
          description: Customer marked inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerResponse'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
  /customers/{code}/activate:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Customer_CustomerCode'
    post:
      operationId: activateCustomer
      tags:
        - INLA-S_Customer_Customers
      summary: Activate customer (ADMIN)
      description: >-
        Sets customer `status` to `active`. Only callers in the **ADMIN**
        Cognito group may use this route.
      responses:
        '200':
          description: Customer marked active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_CustomerResponse'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
  /customers/{code}/contacts:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Customer_CustomerCode'
    get:
      operationId: listContacts
      tags:
        - INLA-S_Customer_Contacts
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/INLA-S_Customer_Page'
        - $ref: '#/components/parameters/INLA-S_Customer_PageSize'
      responses:
        '200':
          description: Contacts for the customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_ContactListResponse'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
    post:
      operationId: createContact
      tags:
        - INLA-S_Customer_Contacts
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Customer_CreateContactRequest'
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/INLA-S_Customer_ContactResponse'
        '400':
          $ref: '#/components/responses/INLA-S_Customer_BadRequest'
        '401':
          $ref: '#/components/responses/INLA-S_Customer_Unauthorized'
        '403':
          $ref: '#/components/responses/INLA-S_Customer_Forbidden'
        '404':
          $ref: '#/components/responses/INLA-S_Customer_NotFound'
        '500':
          $ref: '#/components/responses/INLA-S_Customer_InternalError'
      security:
        - INLA-S_Customer_cognitoAccessToken: []
  /customers/{code}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/INLA-S_Customer_CustomerCode'
      - $ref: '#/components/parameters/INLA-S_Customer_ContactId'
