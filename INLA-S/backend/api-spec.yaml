          type: integer
          default: 1
        pageSize:
          type: integer
          default: 20
    INLA-S_Quotation_QaLineItemData:
      type: object
      required:
        - lineNumber
      description: >-
        Per quotation line (BM03 / QA-09…15 + optional QA-01/03-style fields per
        line).
      properties:
        lineNumber:
          type: integer
          minimum: 1
          description: Must match `lineItems[].lineNumber` for the current cycle.
        qualityAssessmentResult:
          type: string
          nullable: true
        qualityRequirements:
          type: string
          nullable: true
        qaNote:
          type: string
          nullable: true
        burstStandard:
          type: string
          nullable: true
          description: QA-09
        compressionStandard:
          type: string
          nullable: true
          description: QA-10
        weightLimitStandard:
          type: string
          nullable: true
          description: QA-11
        kcgStandard:
          type: string
          nullable: true
          description: QA-12
        kcgQaSxProposal1:
          type: string
          nullable: true
          description: QA-13
        kcgQaSxProposal2:
          type: string
          nullable: true
          description: QA-14
        kcgQaSxProposal3:
          type: string
          nullable: true
          description: QA-15
    INLA-S_Quotation_RndLineItemData:
      type: object
      required:
        - lineNumber
      description: Per quotation line — RND-01, RND-02, RND-11, RND-05.
      properties:
        lineNumber:
          type: integer
          minimum: 1
        printingPlateCost:
          type: number
          minimum: 0
          nullable: true
          description: RND-01
        dieCost:
          type: number
          minimum: 0
          nullable: true
          description: RND-02
        productionPlan:
          type: string
          nullable: true
          description: >-
            RND-11 production steps (e.g. separated by `>`); non-whitespace
            required for task complete.
        rndNote:
          type: string
          nullable: true
          description: RND-05
    INLA-S_Quotation_QaData:
      type: object
      required:
        - qaLineData
      description: Per-line QA rows (`quotation_line_qa`), ordered by `lineNumber`.
      properties:
        qaLineData:
          type: array
          items:
            $ref: '#/components/schemas/INLA-S_Quotation_QaLineItemData'
          description: >-
            One element per current-cycle line; may be `[]` before fill or when
            there are no lines.
      example:
        qaLineData:
          - lineNumber: 1
            qualityAssessmentResult: Đạt
            burstStandard: ≥ 800 kPa
            compressionStandard: ≥ 4000 N
            weightLimitStandard: ≤ 15 kg
            kcgStandard: Đạt Tiger spec
            kcgQaSxProposal1: Đề xuất 1
            kcgQaSxProposal2: Đề xuất 2
            kcgQaSxProposal3: null
    INLA-S_Quotation_QaDataPut:
      type: object
      required:
        - qaLineData
      properties:
        qaLineData:
          type: array
          items:
            $ref: '#/components/schemas/INLA-S_Quotation_QaLineItemData'
    INLA-S_Quotation_RndData:
      type: object
      required:
        - rndLineData
      description: Per-line R&D rows (`quotation_line_rnd`), ordered by `lineNumber`.
      properties:
        rndLineData:
          type: array
          items:
            $ref: '#/components/schemas/INLA-S_Quotation_RndLineItemData'
          description: One element per current-cycle line.
      example:
        rndLineData:
          - lineNumber: 1
            printingPlateCost: 1500000
            dieCost: 800000
            productionPlan: in cuộn > sóng > bế > đóng pallet
