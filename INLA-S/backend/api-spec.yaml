      - $ref: '#/components/parameters/INLA-S_Quotation_QuotationCode'
    put:
      operationId: updateRndData
      tags:
        - INLA-S_Quotation_RoleData
      summary: Save R&D payload (R&D)
      description: >
        **Full replace** of `rndLineData` for the current cycle. Body must
        include `rndLineData` (array).

        Same line-count / `lineNumber` rules as QA. Persisted on
        `quotation_line_rnd`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/INLA-S_Quotation_RndDataPut'
      responses:
        '200':
